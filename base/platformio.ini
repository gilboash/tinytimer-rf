; Lap-timer base station: XIAO ESP32S3 + Wio-SX1262 (the 30-pin B2B module from
; the Seeed kit). Receives passes from the gate over LoRa, ACKs them, and hands
; everything to the server as JSON lines over USB.
;
;   pio run -e base -t upload && pio device monitor -e base

[platformio]
default_envs = base

[env:base]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.7.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I../common
