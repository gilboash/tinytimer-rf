; Lap-timer base station: XIAO ESP32S3 + Wio-SX1262 (the 30-pin B2B module from
; the Seeed kit). Receives passes from the gate over LoRa, ACKs them, and hands
; everything to the server as JSON lines over USB, and runs the race itself:
; it is a WiFi hotspot (LapTimer) serving the same web pages as server/lapserver.py.
;
;   pio run -e base -t upload && pio device monitor -e base

[platformio]
default_envs = base

[env:base]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.7.1
    esp32async/ESPAsyncWebServer@^3.7.7
    esp32async/AsyncTCP@^3.3.8
    bblanchon/ArduinoJson@^7.2.0
extra_scripts = pre:embed_web.py
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I../common
