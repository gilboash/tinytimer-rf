<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker>
    <style>.b{fill:#fff;stroke:#0b0b0b;stroke-width:2;rx:12}.h{font-weight:700;font-size:19px;fill:#0b0b0b}.t{font-size:14px;fill:#333}.s{font-size:13px;fill:#2a78d6;font-weight:600}.d{fill:#f2f2ef;stroke:#9a9a94;stroke-width:1.5;rx:12;stroke-dasharray:6 4}</style>
  </defs>
  <rect width="980" height="360" fill="#fafaf8"/>
  <!-- quads -->
  <g font-size="13" fill="#555"><text x="40" y="52">5.8 GHz video from up to 8 quads</text></g>
  <path d="M150 62 q0 22 0 40" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <!-- gate -->
  <rect class="b" x="30" y="110" width="270" height="170"/>
  <text class="h" x="50" y="144">Gate</text>
  <text class="t" x="50" y="170">XIAO ESP32-C5 + Wio-SX1262</text>
  <text class="t" x="50" y="196">scans 8 pilot channels (SDR)</text>
  <text class="t" x="50" y="218">detects crossings, per-pilot thresholds</text>
  <text class="t" x="50" y="240">keeps names + settings in flash</text>
  <text class="t" x="50" y="262">powered from a power bank</text>
  <!-- lora -->
  <path d="M300 195 L395 195" stroke="#2a78d6" stroke-width="3" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="304" y="180">LoRa</text><text class="s" x="304" y="216">868 MHz</text>
  <!-- base -->
  <rect class="b" x="400" y="110" width="270" height="170"/>
  <text class="h" x="420" y="144">Base</text>
  <text class="t" x="420" y="170">XIAO ESP32-S3 + Wio-SX1262</text>
  <text class="t" x="420" y="196">ACKs passes, runs the race engine</text>
  <text class="t" x="420" y="218">WiFi hotspot + captive portal</text>
  <text class="t" x="420" y="240">serves the pages from its flash</text>
  <text class="t" x="420" y="262">no computer needed at the track</text>
  <!-- wifi -->
  <path d="M670 160 L760 120" stroke="#2a78d6" stroke-width="3" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="690" y="118">WiFi</text>
  <rect class="b" x="765" y="60" width="190" height="100"/>
  <text class="h" x="783" y="92">Phones</text>
  <text class="t" x="783" y="116">join tinytimer_breaking</text>
  <text class="t" x="783" y="138">race page · base page</text>
  <!-- mac -->
  <path d="M670 240 L760 270" stroke="#9a9a94" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="690" y="276" font-size="13" fill="#777">USB</text>
  <rect class="d" x="765" y="225" width="190" height="100"/>
  <text class="h" x="783" y="257" fill="#555">Computer</text>
  <text class="t" x="783" y="281">optional: lapserver.py</text>
  <text class="t" x="783" y="303">debug dashboards over USB</text>
  <path d="M300 255 Q530 345 765 300" stroke="#9a9a94" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="440" y="338" font-size="13" fill="#777">USB (live signal graph, flashing)</text>
</svg>
